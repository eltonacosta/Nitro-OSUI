PACKAGE_NAME="linuwu_sense"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="linuwu_sense"
BUILT_MODULE_LOCATION[0]="src/"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"

# O módulo tem de ser compilado com o mesmo compilador do kernel alvo: kernels
# Clang (padrão do CachyOS) exigem LLVM=1, kernels GCC rejeitam o Clang (não
# entende -mindirect-branch=..., -mpreferred-stack-boundary=...). Um LLVM=1
# fixo aqui quebrava o rebuild automático assim que um kernel GCC aparecia
# (ex.: linux-cachyos-lts) — foi o 'dkms install ... exited 10' visto nas
# atualizações. O DKMS 3.4+ tenta detectar sozinho, versões anteriores não;
# a decisão é tomada aqui, por kernel, a partir dos arquivos de configuração
# do kernel alvo (kernel_config é definido pelo DKMS; os demais caminhos
# cobrem DKMS antigo e árvores que trazem só um deles).
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
if grep -qs '^CONFIG_CC_IS_CLANG=y' "${kernel_config:-}" \
    || grep -qs '^CONFIG_CC_IS_CLANG=y' "${kernel_source_dir:-}/include/config/auto.conf" \
    || grep -qs '^CONFIG_CC_IS_CLANG=y' "${kernel_source_dir:-}/.config" \
    || grep -qs '^CONFIG_CC_IS_CLANG=y' "/boot/config-${kernelver:-}"; then
    MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build LLVM=1 modules"
fi

CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
